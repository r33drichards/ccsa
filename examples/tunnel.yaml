# Harder: mine a 3-long tunnel going south, then come back to the start cell and
# original facing. A single turtle.dig() can't satisfy this — the agent must
# navigate and return, iterating against validator feedback if the first try is
# wrong.
task: >-
  Write a ComputerCraft turtle program that mines a straight 3-block tunnel in
  front of it (the three cells directly ahead), then returns to its exact
  starting position and facing.

sim:
  timeout_ms: 20000
  nodes:
    - label: digger
      collect: true
      program: "@file:tunnel.lua"
      world_lua: |
        return {
          start = { x=0, y=64, z=0, facing='south', fuel=100 },
          blocks = {
            ['0,64,1'] = 'minecraft:stone',
            ['0,64,2'] = 'minecraft:stone',
            ['0,64,3'] = 'minecraft:stone',
          },
          test = function(sim)
            sim.assertBlock(0,64,1, nil, 'cell 1 mined')
            sim.assertBlock(0,64,2, nil, 'cell 2 mined')
            sim.assertBlock(0,64,3, nil, 'cell 3 mined')
            sim.assertPos(0,64,0, 'returned to start')
            sim.assertFacing('south', 'original facing restored')
          end
        }
