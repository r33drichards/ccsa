# Author a turtle program that mines the stone block directly in front, then
# returns to its starting cell. The validator runs this exact sim and gates on
# the world.test(sim) postcondition.
task: >-
  Write a ComputerCraft turtle program that digs the block directly in front of
  the turtle and ends back at its starting position and facing.

sim:
  timeout_ms: 15000
  worlds:
    rover_world_1: |
      return {
        start = { x=0, y=64, z=0, facing='south', fuel=100 },
        blocks = { ['0,64,1'] = 'minecraft:stone' },
        test = function(sim)
          sim.assertBlock(0,64,1, nil, 'front block mined')
          sim.assertItem(1, 'minecraft:stone', 1, 'stone collected in slot 1')
          sim.assertPos(0,64,0, 'returned to start')
          sim.assertFacing('south', 'still facing south')
        end
      }

  nodes:
    - label: rover
      collect: true
      program: "@file:turtle.lua"      # <- the agent writes this file
      world: rover_world_1
